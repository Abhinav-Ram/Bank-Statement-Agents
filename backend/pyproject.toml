[project]
name = "bank-agents"
version = "0.0.1"
description = "Bank statement agents: local-LLM extraction, categorization and hybrid RAG"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "psycopg[binary,pool]>=3.2",
    "langgraph>=1.2.24",
    "pymupdf>=2.1",
    "langgraph-checkpoint-postgres>=3.2.1",
    "fastembed>=0.9.1",
    "sqlglot>=30.35.0",
    "python-multipart>=0.0.34",
]

[dependency-groups]
# Synthetic data generation (PDF rendering + simulated scans). Not needed in the API image.
synth = [
    "reportlab>=4.2",
    "pymupdf>=1.24",
    "pillow>=11.0",
    "numpy>=2.0",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]
ocr = [
    "opencv-python-headless>=5.1.0.95",
    "pyobjc-framework-quartz>=13.1 ; sys_platform == 'darwin'",
    "pyobjc-framework-vision>=13.1 ; sys_platform == 'darwin'",
    "pytesseract>=0.3.13",
    "rapidocr-onnxruntime>=1.4.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.uv]
# Local dev gets everything; the Docker API image installs only main deps (--no-dev).
default-groups = ["dev", "synth", "ocr"]
