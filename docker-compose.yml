# Postgres+pgvector and the web UI run in Docker. The API runs NATIVELY on the Mac
# (cd backend && uv run uvicorn app.main:app --port 8080) because Apple Vision OCR needs macOS;
# the web container proxies to it via host.docker.internal. `--profile docker-api` starts a
# containerised API instead (digital PDFs only: no Apple Vision in Linux).
# The chat LLM is GroqCloud (remote, from .env). Memory limits keep the stack small on 8 GB.
name: bank-agents

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: bank
      POSTGRES_PASSWORD: bank
      POSTGRES_DB: bank_agents
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=30"]
    ports: ["5433:5432"]  # host 5433: a local Homebrew Postgres may already own 5432
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bank -d bank_agents"]
      interval: 3s
      timeout: 3s
      retries: 20
    mem_limit: 384m

  api:
    profiles: ["docker-api"]
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://bank:bank@db:5432/bank_agents
    ports: ["8080:8080"]
    volumes:
      - ./backend/app:/srv/app
      - ./data:/srv/data
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 512m

  web:
    build: ./frontend
    environment:
      API_PROXY_TARGET: ${API_PROXY_TARGET:-http://host.docker.internal:8080}
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["5173:5173"]
    volumes:
      - ./frontend/src:/web/src
    mem_limit: 384m

volumes:
  pgdata:
