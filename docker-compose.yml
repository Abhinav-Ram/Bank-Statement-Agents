# Postgres+pgvector, API and web run in Docker. The chat LLM is GroqCloud (remote, from .env);
# OCR runs natively on macOS (Apple Vision isn't available in containers). Memory limits
# keep the stack small on an 8 GB Mac.
name: bank-agents

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: bank
      POSTGRES_PASSWORD: bank
      POSTGRES_DB: bank_agents
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=30"]
    ports: ["5433:5432"]  # host 5433: a local Homebrew Postgres may already own 5432
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bank -d bank_agents"]
      interval: 3s
      timeout: 3s
      retries: 20
    mem_limit: 384m

  api:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://bank:bank@db:5432/bank_agents
    ports: ["8080:8080"]
    volumes:
      - ./backend/app:/srv/app
      - ./data:/srv/data
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 512m

  web:
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://api:8080
    ports: ["5173:5173"]
    volumes:
      - ./frontend/src:/web/src
    depends_on: [api]
    mem_limit: 384m

volumes:
  pgdata:
